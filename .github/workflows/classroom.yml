name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Build and deploy with Docker Compose
        run: |
          docker-compose down
          docker-compose pull
          docker-compose up -d --build
          docker image prune -f

